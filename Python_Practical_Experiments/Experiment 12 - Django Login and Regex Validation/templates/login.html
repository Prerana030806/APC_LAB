<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Django Login Validation</title>
</head>
<body>
    <h2>User Login</h2>
    {% if message %}<p>{{ message }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Validate Login</button>
    </form>
</body>
</html>
